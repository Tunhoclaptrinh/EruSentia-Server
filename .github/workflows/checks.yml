name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: backend-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-week6-only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ci-week6-only
      DB_DATABASE: postgres
      DB_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm community:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Isolated Week 6 PostgreSQL integration
        run: pnpm test:week6
      - name: Validate hosted Compose configuration
        run: |
          PROJECT_DB_PASSWORD=ci-only-db-password PROJECT_RABBIT_PASSWORD=ci-only-queue-password PROJECT_JWT_SECRET=ci-only-secret-at-least-32-bytes-long HOSTED_API_DOMAIN=api.example.com \
            docker compose --project-directory "$PWD" --profile tools -f docker/compose.project.yml -f docker/compose.hosted.yml config --quiet
  hosted:
    name: Hosted PostgreSQL TLS and startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:hosted
      - name: Local Mailpit account verification and reset
        run: pnpm test:account-email
      - uses: docker/setup-buildx-action@v3
      - name: Build the Render Docker image
        run: docker buildx build --load --tag erusentia-render-ci .
