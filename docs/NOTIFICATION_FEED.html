      --paper-page-width: 793.7007874015749px;
      --paper-page-height: 1122.5196850393702px;
      --paper-bg: #ffffff;
    }
    html[data-theme="dark"], body[data-theme="dark"] {
      --accent: #ff4364;
      --accent-rgb: 255, 67, 100;
      --accent-subtle: rgba(255, 67, 100, 0.15);
      --bg-page: #141312;

      --card-background: #242220;

</style><div data-api-ui="" data-eru-transient="true"></div><script>{
function createEruHostedResourceBridge(connection) {
  const endpoint = new URL(connection.gatewayUrl)
  if (
    endpoint.username ||
    endpoint.password ||
    endpoint.pathname !== '/' ||
    endpoint.search ||
    endpoint.hash ||
    !['https:', 'http:'].includes(endpoint.protocol)
  )
    throw Error('Địa chỉ dịch vụ tài nguyên không hợp lệ.')
  if (
    endpoint.protocol === 'http:' &&
    !['127.0.0.1', 'localhost', '[::1]'].includes(endpoint.hostname)
  )
    throw Error('Dịch vụ online cần HTTPS.')
  const origin = endpoint.origin,
    mount = connection.hostedMount
  if (!mount) throw Error('Không tìm thấy khung đăng nhập dịch vụ tài nguyên.')
  const session = Array.from(
    crypto.getRandomValues(new Uint8Array(16)),
    (value) => value.toString(16).padStart(2, '0'),
  ).join('')
  const frame = document.createElement('iframe')
  frame.title = 'Đăng nhập dịch vụ tài nguyên EruSentia'
  frame.referrerPolicy = 'no-referrer'
  frame.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin')
  frame.style.cssText =
    'display:block;width:100%;height:300px;border:1px solid var(--border-normal,#ddd);border-radius:8px;background:#fafafa'
  frame.src = origin + '/resource-gateway/connect#' + session
  let identity = null
  const pending = new Map()
  const post = (value) =>
    frame.contentWindow?.postMessage(
      { type: 'eru-resource-v1', session, ...value },
      origin,
    )
  const hello = () => post({ kind: 'hello' })
  const receive = (event) => {
    const data = event.data
    if (
      event.source !== frame.contentWindow ||
      event.origin !== origin ||
      data?.type !== 'eru-resource-v1' ||
      data.session !== session
    )
      return
    if (data.kind === 'authenticated') {
      identity = data.value?.enabled ? data.value : null
      connection.onIdentity?.(identity)
      return
    }
    if (data.kind === 'disconnected') {
      identity = null
      connection.onIdentity?.(null)
      return
    }
    if (data.kind !== 'result' || !pending.has(data.id)) return
    const entry = pending.get(data.id)
    pending.delete(data.id)
    entry.cleanup()
    if (data.error) {
      const messages = {
        RESOURCE_DOCUMENT_ACCESS_DENIED:
          'Tài khoản này chưa được cấp quyền mở tài liệu.',
        RESOURCE_DOCUMENT_NOT_FOUND: 'Tài liệu không tồn tại hoặc đã bị xóa.',
        RESOURCE_DAILY_QUOTA_EXCEEDED:
          'Đã hết hạn mức hôm nay. Thử lại ngày mai hoặc liên hệ quản trị viên.',
        RESOURCE_PLAN_REQUIRED_OR_BLOCKED:
          'Tài khoản chưa được cấp quyền dùng dịch vụ hoặc đang bị khóa.',
        RESOURCE_TARGET_NOT_ALLOWED:
          'Máy chủ API chưa được dịch vụ cho phép. Liên hệ quản trị viên để thêm origin.',
        RESOURCE_TARGET_PATH_NOT_ALLOWED:
          'Đường dẫn này không được gọi qua proxy. Dùng giao diện quản trị hoặc API trực tiếp.',
        RESOURCE_GATEWAY_DISABLED: 'Dịch vụ tài nguyên đang tạm tắt.',
        RESOURCE_SERVICE_BUSY: 'Dịch vụ đang bận. Hãy thử lại sau.',
        RESOURCE_PRIVATE_ADDRESS_BLOCKED:
          'Dịch vụ online không truy cập mạng riêng. Hãy dùng gateway cục bộ.',
        RESOURCE_UPSTREAM_UNAVAILABLE:
          'Dịch vụ không kết nối được máy chủ API đích. Kiểm tra URL và thử lại.',
        RESOURCE_UPSTREAM_TIMEOUT:
          'Máy chủ API đích chưa phản hồi kịp. Hãy thử lại.',
      }
      const error = Error(
        messages[data.error.message] ||
          data.error.message ||
          'Dịch vụ tài nguyên từ chối yêu cầu.',
      )
      error.status = data.error.status
      entry.reject(error)
    } else entry.resolve(data.value)
  }
  addEventListener('message', receive)
  frame.addEventListener('load', hello)
  mount.replaceChildren(frame)
  const expand = () => {
    const details = mount.closest('[data-network]')
    if (details) details.open = true
  }
  return {
    origin,
    async call(action, payload, signal) {
      expand()
      if (!identity)
        throw Error(
          'Đăng nhập dịch vụ EruSentia trong khung kết nối trước khi sử dụng proxy online.',
        )
      if (signal?.aborted) throw new DOMException('Aborted', 'AbortError')
      return new Promise((resolve, reject) => {
        const id = crypto.randomUUID()
        let timer
        const abort = () => {
          post({ kind: 'cancel', id })
          pending.delete(id)
          cleanup()
          reject(new DOMException('Aborted', 'AbortError'))
        }
        const cleanup = () => {
          clearTimeout(timer)
          signal?.removeEventListener('abort', abort)
        }
        timer = setTimeout(() => {
          post({ kind: 'cancel', id })
          pending.delete(id)
          cleanup()
          reject(Error('Dịch vụ tài nguyên chưa phản hồi sau 15 giây.'))
        }, 15000)
        pending.set(id, { resolve, reject, cleanup })
        signal?.addEventListener('abort', abort, { once: true })
        post({ kind: 'request', id, action, payload })
      })
    },
    identity: () => identity,
    destroy() {
      for (const entry of pending.values()) {
        entry.cleanup()
        entry.reject(Error('Kết nối dịch vụ đã đóng.'))
      }
      pending.clear()
      removeEventListener('message', receive)
      frame.remove()
      identity = null
    },
  }
}

function createEruResourceTransport() {
  const gatewayAddress = (value) => {
    const url = new URL(value)
    if (
      url.username ||
      url.password ||
      url.search ||
      url.hash ||
      url.pathname !== '/' ||
      !['http:', 'https:'].includes(url.protocol)
    )
      throw Error('Địa chỉ gateway không hợp lệ.')
    if (
      url.protocol === 'http:' &&
      !['127.0.0.1', 'localhost', '[::1]'].includes(url.hostname)
    )
      throw Error('Gateway HTTP phải chạy trên máy cục bộ.')
    return url.origin
  }
  let hosted
  const bridge = (connection) => {
    const origin = new URL(connection.gatewayUrl).origin
    if (!hosted || hosted.origin !== origin) {
      hosted?.destroy()
      hosted = createEruHostedResourceBridge(connection)
    }
    return hosted
  }
  const decode = (result, method) => {
    if (
      result.version !== 1 ||
      typeof result.bodyBase64 !== 'string' ||
      !Number.isInteger(result.status)
    )
      throw Error('Dịch vụ trả về định dạng không được hỗ trợ.')
    const bytes = Uint8Array.from(atob(result.bodyBase64), (c) =>
      c.charCodeAt(0),
    )
    return new Response(
      [204, 205, 304].includes(result.status) || method === 'HEAD'
        ? null
        : bytes,
      {
        status: result.status,
        statusText: result.statusText,
        headers: result.headers,
      },
    )
  }
  return {
    disconnectHosted() {
      hosted?.destroy()
      hosted = null
    },
    connectHosted(connection) {
      return bridge(connection)
    },
    async openDocument(id, connection, signal) {
      return bridge(connection).call('document', { id }, signal)
    },
    async checkGateway(connection, signal) {
      if (connection.transport === 'hosted') {
        const info = await bridge(connection).call('status', {}, signal)
        return { ...info, targets: info.targetOrigins }
      }
      if (!connection.gatewayKey)
        throw Error(
          'Dán khóa phiên được in trong terminal chạy Resource Gateway.',
        )
      const response = await fetch(
        gatewayAddress(connection.gatewayUrl) + '/v1/status',
        {
          headers: { 'X-Eru-Gateway-Key': connection.gatewayKey },
          credentials: 'omit',
          redirect: 'error',
          signal,
        },
      )
      if (!response.ok)
        throw Error('Gateway từ chối khóa phiên hoặc không sẵn sàng.')
      return response.json()
    },
    async request(url, options, connection) {
      if (connection.transport === 'hosted')
        return decode(
          await bridge(connection).call(
            'request',
            {
              url,
              method: options.method || 'GET',
              headers: Object.fromEntries(new Headers(options.headers)),
              ...(options.body !== undefined ? { body: options.body } : {}),
              ...(connection.documentId
                ? { documentId: connection.documentId }
                : {}),
            },
            options.signal,
          ),
          options.method,
        )
      if (connection.transport !== 'gateway')
        return fetch(url, {
          ...options,
          credentials: 'omit',
          redirect: 'error',
        })
      if (!connection.gatewayKey)
        throw Error(
          'Cần khóa phiên để dùng gateway. Chạy Resource Gateway rồi dán khóa vào mục Kết nối.',
        )
      const response = await fetch(
        gatewayAddress(connection.gatewayUrl) + '/v1/request',
        {
          method: 'POST',
          credentials: 'omit',
          redirect: 'error',
          signal: options.signal,
          headers: {
            'Content-Type': 'application/json',
            'X-Eru-Gateway-Key': connection.gatewayKey,
          },
          body: JSON.stringify({
            url,
            method: options.method || 'GET',
            headers: Object.fromEntries(new Headers(options.headers)),
            ...(options.body !== undefined ? { body: options.body } : {}),
          }),
        },
      )
      const result = await response.json()
      if (!response.ok) {
        const messages = {
          TARGET_NOT_ALLOWED:
            'Máy chủ này chưa được gateway cho phép. Khởi động gateway với --target đúng origin.',
          GATEWAY_PAIRING_REQUIRED:
            'Khóa gateway không đúng hoặc phiên đã đổi.',
          UPSTREAM_REDIRECT_BLOCKED:
            'Máy chủ chuyển hướng. Dùng URL đích trực tiếp để tránh chuyển thông tin xác thực sang máy chủ khác.',
          UPSTREAM_TIMEOUT: 'Máy chủ đích không phản hồi trong thời gian chờ.',
          UPSTREAM_UNREACHABLE:
            'Gateway không kết nối được API đích. Kiểm tra địa chỉ và dịch vụ.',
          UPSTREAM_TLS_ERROR:
            'Chứng chỉ TLS của API chưa được tin cậy. Cài CA hợp lệ cho gateway; không tắt xác minh TLS.',
          RESPONSE_TOO_LARGE: 'Phản hồi vượt giới hạn 2 MiB của gateway.',
        }
        throw Error(
          messages[result.error] ||
            `Gateway không hoàn tất yêu cầu: ${result.error || response.status}`,
        )
      }
      return decode(result, options.method)
    },
  }
}

function createEruToolConnectionMarkup(config, escape) {
  let targetOrigin = config.baseUrl
  try {
    targetOrigin = new URL(config.baseUrl).origin
  } catch {
    /* Editable URL. */
  }
  const mode = ['gateway', 'hosted'].includes(config.transport)
    ? config.transport
    : 'direct'
  return `<section class="api-connection" aria-label="Cấu hình kết nối"><div class="api-connect-row"><label>Máy chủ API<input data-base type="url" value="${escape(config.baseUrl)}" spellcheck="false" placeholder="http://127.0.0.1:3001"></label><span data-connection-actions></span></div>
  <details data-network ${mode === 'hosted' ? 'open' : ''}><summary>Đường kết nối <span data-route-label>· ${mode === 'hosted' ? 'Dịch vụ Render' : mode === 'gateway' ? 'Gateway cục bộ' : 'Trực tiếp'}</span></summary><div class="api-network-grid"><label>Phương thức kết nối<select data-transport><option value="hosted" ${mode === 'hosted' ? 'selected' : ''}>EruSentia online · đăng nhập tài khoản</option><option value="direct" ${mode === 'direct' ? 'selected' : ''}>Trực tiếp · API cho phép CORS</option><option value="gateway" ${mode === 'gateway' ? 'selected' : ''}>Resource Gateway · file HTML / API khác origin</option></select></label><div data-gateway-settings ${mode === 'direct' ? 'hidden' : ''}><label>Địa chỉ gateway<input data-gateway-url value="${escape(config.gatewayUrl || (mode === 'hosted' ? 'https://erusentia-api.onrender.com' : 'http://127.0.0.1:3198'))}" type="url"></label><label data-local-key ${mode !== 'gateway' ? 'hidden' : ''}>Khóa phiên gateway<input data-gateway-key type="password" autocomplete="off" placeholder="Dán khóa được in trong terminal"></label><button type="button" data-action="check-gateway">Kiểm tra gateway</button></div></div><div data-hosted-settings ${mode !== 'hosted' ? 'hidden' : ''}><div data-hosted-mount></div><label style="margin-top:12px">ID tài liệu được bảo vệ (tùy chọn)<input data-document-id value="${escape(config.documentId || '')}" placeholder="UUID do chủ tài liệu cấp"></label><button type="button" data-action="open-document">Mở tài liệu được cấp quyền</button><div data-document-preview hidden></div><p class="api-auth-note">Dịch vụ kiểm tra tài khoản, quyền tài liệu và hạn mức. Phiên đăng nhập chỉ nằm trong khung dịch vụ. Với API cùng máy chủ, phiên này được dùng để xác thực yêu cầu; API khác có thể cần token riêng ở mục Xác thực.</p></div><p data-local-help class="api-auth-note" ${mode !== 'gateway' ? 'hidden' : ''}>Chạy <code>pnpm resource:gateway --target ${escape(targetOrigin)}</code>. Chỉ máy chủ được khai báo mới được chuyển tiếp; khóa phiên không lưu vào tài liệu.</p></details>
  <details data-auth><summary>Xác thực API đích <span data-auth-label>· Chưa đăng nhập</span></summary><form data-login class="api-auth-grid"><label>Email<input data-email type="email" autocomplete="off" required placeholder="ban@example.com"></label><label>Mật khẩu<input data-password type="password" autocomplete="off" required placeholder="Mật khẩu tài khoản"></label><button class="api-primary" type="submit">Đăng nhập</button></form><div class="api-token-row"><label>Hoặc Bearer token<input data-token type="password" autocomplete="off" placeholder="Dán access token"></label><button type="button" data-action="authorize">Dùng token</button><button type="button" data-action="logout" hidden>Xóa xác thực</button></div><p class="api-auth-note">Mật khẩu, Bearer token và khóa gateway chỉ ở trong bộ nhớ của khối này.</p></details></section>`
}
function createEruToolConnection({
  root,
  ui,
  config,
  feedback,
  status,
  busy = () => {},
  changed = () => {},
  authChanged = () => {},
}) {
  const $ = (selector) => ui.querySelector(selector)
  const transport = createEruResourceTransport()
  let token = '',
    tokenBase = '',
    pending = null,
    epoch = 0
  const base = () => {
    const url = new URL($('[data-base]').value.trim())
    if (
      url.username ||
      url.password ||
      url.search ||
      url.hash ||
      !['http:', 'https:'].includes(url.protocol)
    )
      throw Error(
        'Nhập URL HTTP/HTTPS không kèm tài khoản, query hoặc fragment.',
      )
    return url.href.replace(/\/$/, '')
  }
  const settings = () => ({
    baseUrl: base(),
    transport: $('[data-transport]').value,
    gatewayUrl: $('[data-gateway-url]').value.trim(),
    ...($('[data-document-id]').value.trim()
      ? { documentId: $('[data-document-id]').value.trim() }
      : {}),
  })
  const secretSettings = () => ({
    ...settings(),
    gatewayKey: $('[data-gateway-key]').value.trim(),
    hostedMount: $('[data-hosted-mount]'),
    onIdentity: () => {
      let active = false
      try {
        active = authenticated()
      } catch {
        /* Editable URL. */
      }
      if (!token)
        $('[data-auth-label]').textContent = active
          ? '· Dùng phiên dịch vụ'
          : '· Chưa đăng nhập'
      authChanged(active)
    },
  })
  const hosted = () => transport.connectHosted(secretSettings())
  const authenticated = () =>
    !!token ||
    (settings().transport === 'hosted' &&
      !!hosted().identity() &&
      new URL(base()).origin === hosted().origin)
  const clear = () => {
    token = ''
    tokenBase = ''
    $('[data-token]').value = ''
    $('[data-password]').value = ''
    $('[data-auth-label]').textContent = '· Chưa đăng nhập'
    $('[data-action="logout"]').hidden = true
    authChanged(false)
  }
  const authorize = (value, label) => {
    if (!value?.trim() || /\s/.test(value.trim()))
      throw Error('Token trống hoặc có khoảng trắng không hợp lệ.')
    token = value.trim()
    tokenBase = base()
    $('[data-token]').value = ''
    $('[data-password]').value = ''
    $('[data-auth-label]').textContent = `· ${label}`
    $('[data-action="logout"]').hidden = false
    authChanged(true)
    feedback('Đã cấp token cho máy chủ này. Token không được lưu vào tài liệu.')
  }
  const request = async (path, options = {}, anonymous = false) => {
    if (pending)
      throw Error('Đang có yêu cầu chạy. Hãy đợi hoặc hủy yêu cầu hiện tại.')
    const server = base(),
      currentEpoch = epoch
    if (token && tokenBase !== server) clear()
    const url = new URL(path.startsWith('http') ? path : server + path)
    if (url.origin !== new URL(server).origin)
      throw Error('Yêu cầu phải thuộc máy chủ API đang chọn.')
    const controller = new AbortController()
    pending = controller
    let timedOut = false
    const timer = setTimeout(() => {
      timedOut = true
      controller.abort()
    }, 15000)
    busy(true)
    status('Đang kết nối…')
    try {
      const res = await transport.request(
        url.href,
        {
          ...options,
          signal: controller.signal,
          headers: {
            ...options.headers,
            ...(!anonymous && token
              ? { Authorization: `Bearer ${token}` }
              : {}),
          },
        },
        secretSettings(),
      )
      const text = options.method === 'HEAD' ? '' : await res.text()
      if (text.length > 2000000)
        throw Error('Phản hồi lớn hơn 2 MB. Hãy thu hẹp truy vấn.')
      if (currentEpoch !== epoch || server !== base())
        throw Error('Kết nối đã thay đổi. Hãy gửi lại yêu cầu.')
      status(
        `HTTP ${res.status} · ${settings().transport === 'hosted' ? 'Render' : settings().transport === 'gateway' ? 'Gateway' : 'Trực tiếp'}`,
        res.ok ? 'ok' : 'error',
      )
      let data
      try {
        data = text ? JSON.parse(text) : null
      } catch {
        data = text
      }
      return { res, data, text }
    } catch (error) {
      status('Chưa nhận phản hồi', 'error')
      if (controller.signal.aborted)
        throw Error(
          timedOut ? 'Máy chủ không phản hồi sau 15 giây.' : 'Đã hủy yêu cầu.',
        )
      if (error instanceof TypeError)
        throw Error(
          settings().transport === 'gateway'
            ? 'Không kết nối được gateway. Kiểm tra địa chỉ, dịch vụ cục bộ và quyền truy cập mạng của trình duyệt.'
            : `Không kết nối được. Kiểm tra địa chỉ, CORS và máy chủ. Với file HTML hoặc API chặn CORS, mở Đường kết nối và chọn Resource Gateway. Origin hiện tại: ${location.origin}.`,
        )
      throw error
    } finally {
      clearTimeout(timer)
      pending = null
      busy(false)
    }
  }
  $('[data-login]').addEventListener('submit', async (event) => {
    event.preventDefault()
    feedback()
    try {
      const email = $('[data-email]').value.trim(),
        password = $('[data-password]').value
      const { res, data } = await request(
        '/auth/login',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        },
        true,
      )
      if (!res.ok || typeof data?.accessToken !== 'string')
        throw Error(
          `Đăng nhập thất bại (HTTP ${res.status}). Kiểm tra tài khoản và mật khẩu.`,
        )
      authorize(data.accessToken, data.user?.email || email)
    } catch (error) {
      feedback(error.message, true)
    } finally {
      $('[data-password]').value = ''
    }
  })
  ui.addEventListener('click', async (event) => {
    const action = event.target.closest('button')?.dataset.action
    try {
      if (action === 'authorize')
        authorize($('[data-token]').value, 'Đã cấp Bearer token')
      if (action === 'logout') {
        epoch++
        pending?.abort()
        clear()
        feedback('Đã xóa xác thực trong khối này.')
      }
      if (action === 'cancel') pending?.abort()
      if (action === 'open-document') {
        const id = $('[data-document-id]').value.trim()
        if (!/^[0-9a-f-]{36}$/i.test(id))
          throw Error('Nhập ID tài liệu hợp lệ do chủ tài liệu cấp.')
        const result = await transport.openDocument(
          id,
          secretSettings(),
          AbortSignal.timeout(15000),
        )
        const frame = document.createElement('iframe')
        frame.title = result.title || 'Tài liệu được cấp quyền'
        frame.setAttribute('sandbox', 'allow-scripts')
        frame.referrerPolicy = 'no-referrer'
        frame.style.cssText =
          'width:100%;height:600px;border:1px solid #ddd;border-radius:8px;margin-top:12px'
        frame.srcdoc = result.html
        $('[data-document-preview]').replaceChildren(frame)
        $('[data-document-preview]').hidden = false
        feedback(
          'Đã xác minh quyền và mở tài liệu. Lượt truy cập được ghi nhận trên dịch vụ.',
        )
      }
      if (action === 'check-gateway') {
        const result = await transport.checkGateway(
          secretSettings(),
          AbortSignal.timeout(5000),
        )
        const allowed = result.targets?.includes(new URL(base()).origin)
        feedback(
          allowed
            ? `Dịch vụ sẵn sàng${result.plan ? ' · ' + result.user.email + ' · gói ' + result.plan + ' · còn ' + result.remaining + '/' + result.dailyLimit + ' yêu cầu' : ''}.`
            : 'Dịch vụ chưa cho phép máy chủ này. Quản trị viên cần thêm đúng origin vào danh sách cho phép.',
          !allowed,
        )
      }
    } catch (error) {
      feedback(error.message, true)
    }
  })
  const update = (event) => {
    if (
      event.target.matches(
        '[data-base],[data-transport],[data-gateway-url],[data-document-id]',
      )
    ) {
      epoch++
      pending?.abort()
      const connectionChanged = !event.target.matches('[data-document-id]')
      if (connectionChanged) clear()
      status('Chưa kết nối')
      const mode = $('[data-transport]').value
      if (event.target.matches('[data-transport]')) {
        const address = $('[data-gateway-url]')
        if (mode === 'hosted' && address.value === 'http://127.0.0.1:3198')
          address.value = 'https://erusentia-api.onrender.com'
        if (
          mode === 'gateway' &&
          address.value === 'https://erusentia-api.onrender.com'
        )
          address.value = 'http://127.0.0.1:3198'
      }
      $('[data-gateway-settings]').hidden = mode === 'direct'
      $('[data-local-key]').hidden = mode !== 'gateway'
      $('[data-local-help]').hidden = mode !== 'gateway'
      $('[data-hosted-settings]').hidden = mode !== 'hosted'
      $('[data-document-preview]').replaceChildren()
      $('[data-document-preview]').hidden = true
      if (event.target.matches('[data-transport],[data-gateway-url]'))
        transport.disconnectHosted()
      $('[data-route-label]').textContent =
        mode === 'hosted'
          ? '· Dịch vụ Render'
          : mode === 'gateway'
            ? '· Gateway cục bộ'
            : '· Trực tiếp'
      if (mode === 'hosted') {
        try {
          hosted()
        } catch (error) {
          feedback(error.message, true)
        }
      }
      try {
        Object.assign(config, settings())
        if (!token && authenticated())
          $('[data-auth-label]').textContent = '· Dùng phiên dịch vụ'
        changed()
        feedback(
          connectionChanged
            ? 'Đã cập nhật đường kết nối.'
            : 'Đã cập nhật tài liệu được bảo vệ.',
        )
      } catch (error) {
        feedback(error.message, true)
      }
    }
  }
  ui.addEventListener('change', update)
  window.addEventListener(
    'pagehide',
    () => {
      pending?.abort()
      transport.disconnectHosted()
      token = ''
      $('[data-gateway-key]').value = ''
    },
    { once: true },
  )
  if (settings().transport === 'hosted') {
    try {
      hosted()
    } catch (error) {
      feedback(error.message, true)
    }
  }
  return {
    request,
    base,
    settings,
    authenticated,
    abort: () => pending?.abort(),
    clear,
  }
}

;(() => {
  const root = document.currentScript.closest('.eru-notification-feed')
  if (!root) return
  const ui = root.querySelector('[data-api-ui]')
  const esc = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;')
  const $ = selector => ui.querySelector(selector)
  let config = { type: 'notification-feed', version: 2, title: 'Hộp thông báo', baseUrl: 'http://127.0.0.1:3001', transport: 'direct', gatewayUrl: 'http://127.0.0.1:3198', pageSize: 15 }
  try { config = { ...config, ...JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(root.dataset.templateConfig), c => c.charCodeAt(0)))) } } catch { /* Keep usable defaults. */ }
  if (config.baseUrl === 'auto') {
    config.baseUrl = /^https?:$/.test(location.protocol) ? location.origin : 'https://erusentia-api.onrender.com'

  }
  ui.innerHTML = `<header class="api-head"><div><div class="api-eyebrow">EruSentia / Notifications</div><h2 data-title>${esc(config.title)}</h2><p class="api-muted">Thông báo của tài khoản bạn, cập nhật từ máy chủ.</p></div><span class="api-status" data-status>Chưa kết nối</span></header>${createEruToolConnectionMarkup(config, esc)}<div data-feedback class="api-feedback" role="status" aria-live="polite" hidden></div><section class="api-feed"><div class="api-feed-toolbar"><h3>Thông báo <span data-unread-count class="api-muted"></span></h3><button type="button" data-action="refresh">Làm mới</button><button type="button" data-action="read-all" disabled>Đọc tất cả</button><button type="button" data-action="cancel" hidden>Hủy yêu cầu</button></div><div class="api-feed-options"><button type="button" data-action="filter" aria-pressed="false">Chỉ chưa đọc</button><label>Số mục mỗi trang<select data-page-size>${[...new Set([5,10,15,25,50,Number(config.pageSize)])].sort((a,b)=>a-b).map(n => `<option ${Number(config.pageSize) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label><details><summary>Cấu hình khối</summary><label>Tiêu đề<input data-config-title value="${esc(config.title)}" maxlength="100"></label></details></div><div class="api-feed-list" data-feed></div><button type="button" data-action="more" class="api-feed-more" hidden>Tải thêm</button></section><footer class="api-footer"><span>Không lưu tài khoản hoặc dữ liệu thông báo vào ghi chú.</span><span>Thông báo trực tiếp</span></footer>`
  let items = [], cursor = null, unread = 0, onlyUnread = false, loading = false
  const feedback = (message = '', error = false) => { $('[data-feedback]').hidden = !message; $('[data-feedback]').textContent = message; $('[data-feedback]').dataset.error = String(error) }
  const status = (text, state = 'idle') => { $('[data-status]').textContent = text; $('[data-status]').dataset.state = state }
  const persist = () => {
    const data = { type: 'notification-feed', version: 2, width: config.width || '100%', align: config.align || 'center', fitMode: config.fitMode || 'fit-template', ...connection.settings(), pageSize: Number($('[data-page-size]').value), title: $('[data-config-title]').value.trim() || 'Hộp thông báo' }
    const bytes = new TextEncoder().encode(JSON.stringify(data))
    root.dataset.templateConfig = btoa(Array.from(bytes, b => String.fromCharCode(b)).join(''))
    $('[data-title]').textContent = data.title
    root.dispatchEvent(new Event('input', { bubbles: true }))
  }
  const render = () => {
    const authenticated = connection.authenticated()
    $('[data-unread-count]').textContent = authenticated ? `· ${unread} chưa đọc` : ''
    $('[data-action="more"]').hidden = !cursor
    $('[data-action="read-all"]').disabled = !authenticated || !unread || loading
    const visible = onlyUnread ? items.filter(item => !item.isRead) : items
    $('[data-feed]').innerHTML = !authenticated ? '<div class="api-empty"><h3>Kết nối tài khoản của bạn</h3><p>Mở Xác thực để đăng nhập, sau đó bấm Làm mới.</p></div>' : !visible.length ? `<div class="api-empty"><h3>${loading ? 'Đang tải thông báo…' : onlyUnread ? 'Không có thông báo chưa đọc trong các mục đã tải' : 'Chưa có thông báo'}</h3><p>${cursor ? 'Bạn có thể tải thêm các mục cũ hơn.' : 'Thông báo mới sẽ xuất hiện khi template bạn theo dõi cập nhật.'}</p></div>` : visible.map(item => `<article class="api-feed-item" data-unread="${!item.isRead}"><div><strong>${esc(item.title)}</strong><p>${esc(new Date(item.createdAt).toLocaleString('vi-VN'))}${item.revision ? ` · Bản cập nhật #${esc(item.revision)}` : ''}</p></div>${item.isRead ? '<small>Đã đọc</small>' : `<button type="button" data-read="${esc(item.id)}" ${loading ? 'disabled' : ''}>Đánh dấu đã đọc</button>`}</article>`).join('')
  }
  const connection = createEruToolConnection({ root, ui, config, feedback, status, changed: () => { items = []; cursor = null; unread = 0; persist(); render() }, authChanged: () => { items = []; cursor = null; unread = 0; render() }, busy: value => {
    loading = value
    for (const button of ui.querySelectorAll('[data-action="refresh"],[data-action="more"],[data-action="read-all"],[data-login] button')) button.disabled = value
    $('[data-action="cancel"]').hidden = !value
    render()
  } })
  const load = async more => {
    if (!connection.authenticated()) { $(connection.settings().transport === 'hosted' ? '[data-network]' : '[data-auth]').open = true; throw Error('Đăng nhập dịch vụ trong Đường kết nối hoặc cấp token API trước khi tải thông báo.') }
    const next = more ? cursor : null
    const { res, data } = await connection.request(`/notifications?limit=${Number($('[data-page-size]').value)}${next ? '&cursor=' + encodeURIComponent(next) : ''}`)
    if (!res.ok) throw Error(`Chưa tải được thông báo (HTTP ${res.status}). Kiểm tra tài khoản rồi bấm Làm mới.`)
    if (!Array.isArray(data?.items) || !(data.nextCursor === null || typeof data.nextCursor === 'string')) throw Error('Máy chủ không trả đúng định dạng thông báo EruSentia.')
    items = [...new Map([...(more ? items : []), ...data.items].map(item => [item.id, item])).values()]

  }
  ui.addEventListener('click', async event => {
    const button = event.target.closest('button')
    if (!button || button.disabled) return
    const action = button.dataset.action
    try {
      if (action === 'filter') { onlyUnread = !onlyUnread; button.setAttribute('aria-pressed', String(onlyUnread)); render() }
      if (action === 'refresh' || action === 'more') { feedback(); await load(action === 'more') }

        const id = button.dataset.read
        if (id && !/^[0-9a-f-]{36}$/i.test(id)) throw Error('ID thông báo không hợp lệ.')
        const { res } = await connection.request(id ? `/notifications/${encodeURIComponent(id)}/read` : '/notifications/read-all', { method: id ? 'PATCH' : 'POST' })
        if (!res.ok) throw Error(`Chưa đánh dấu được thông báo (HTTP ${res.status}).`)
        await load(false)
      }
    } catch (error) { feedback(error.message, true) }
  })
  $('[data-page-size]').addEventListener('change', () => { cursor = null; items = []; persist(); render() })
  $('[data-config-title]').addEventListener('change', persist)
  render(); root.dataset.toolReady = 'true'
})()

          Array.from(el.rows).forEach(function(row, rowIndex) {
            var column = 0;
            Array.from(row.cells).forEach(function(cell) {
              while (occupied[column] > rowIndex) column++;
              for (var c = 0; c < cell.colSpan; c++) occupied[column + c] = rowIndex + cell.rowSpan;
              column += cell.colSpan;
              tableColumns = Math.max(tableColumns, column);
            });
          });
          var trs = Array.from(el.querySelectorAll('tr')).filter(function(tr) {
            return !tr.classList.contains('eru-page-break-gap-tr');
          });
          if (trs.length > 1 && (currentUsedH + (currentUsedH > 0 ? blockMargin : 0) + blockH > USABLE_PAGE_H)) {
            var accTableH = 0;
            var splitRow = -1;
            for (var trIdx = 0; trIdx < trs.length; trIdx++) {
              var rH = trs[trIdx].offsetHeight || trs[trIdx].getBoundingClientRect().height || 30;
              if (currentUsedH + (currentUsedH > 0 ? blockMargin : 0) + accTableH + rH > USABLE_PAGE_H) {
                if (trIdx >= 2) {
                  splitRow = trIdx;
                } else if (currentUsedH > 0) {
                  // Chống mồ côi tiêu đề bảng: không để trơ trọi 1 hàng ở đáy trang
                  splitRow = -1;
                } else {
                  splitRow = Math.max(1, trIdx);
                }
                break;
              }
              accTableH += rH;
            }
            if (splitRow > 0) {
              var remTable = Math.max(0, Math.round(USABLE_PAGE_H - (currentUsedH + (currentUsedH > 0 ? blockMargin : 0) + accTableH)));
              var gapTr = createStandaloneGap(currentPage, remTable, { isTableBreak: true, tableColumns: tableColumns });
              trs[splitRow].parentNode.insertBefore(gapTr, trs[splitRow]);
              createdGaps.push({ el: gapTr, page: currentPage });
              currentPage++;

              // Tiếp tục duyệt các hàng còn lại nếu bảng dài qua nhiều trang (Multi-page Table)
              var currentTablePageH = 0;
              var lastSplitR = splitRow;
              for (var r = splitRow; r < trs.length; r++) {
                var rowH = trs[r].offsetHeight || trs[r].getBoundingClientRect().height || 30;
                if (currentTablePageH + rowH > USABLE_PAGE_H && r > lastSplitR) {
                  var rem = Math.max(0, Math.round(USABLE_PAGE_H - currentTablePageH));
                  var nextGapTr = createStandaloneGap(currentPage, rem, { isTableBreak: true, tableColumns: tableColumns });
                  trs[r].parentNode.insertBefore(nextGapTr, trs[r]);
                  createdGaps.push({ el: nextGapTr, page: currentPage });
                  currentPage++;
                  currentTablePageH = rowH;
                  lastSplitR = r;
                } else {
                  currentTablePageH += rowH;
                }
              }

              currentUsedH = currentTablePageH;
              continue;
            }
          }
        }

        // ── Phân tách danh sách đa cấp (Nested List Splitting chuẩn TipTap Pro) ──
        if (el.tagName === 'UL' || el.tagName === 'OL') {
          var flatItems = [];
          collectStandaloneFlatListItems(el, 0, flatItems);
          for (var fi = 0; fi + 1 < flatItems.length; fi++) {
            var distance = flatItems[fi + 1].domEl.getBoundingClientRect().top - flatItems[fi].domEl.getBoundingClientRect().top;
            if (distance > 0) flatItems[fi].height = distance;
          }

          if (flatItems.length > 1) {
            var totalListH = 0;
            for (var fi = 0; fi < flatItems.length; fi++) totalListH += flatItems[fi].height;
            var listWillOverflow = (currentUsedH > 0 && (currentUsedH + blockMargin + totalListH + mb > USABLE_PAGE_H)) ||
                                   (currentUsedH === 0 && totalListH > USABLE_PAGE_H);

            if (listWillOverflow) {
              var accumulatedListHeight = 0;
              var splitIndex = -1;
              var remainingSpace = USABLE_PAGE_H - currentUsedH - (currentUsedH > 0 ? blockMargin : 0);

              for (var liIdx = 0; liIdx < flatItems.length; liIdx++) {
                var item = flatItems[liIdx];
                var isLast = (liIdx === flatItems.length - 1);
                var buffer = (isLast ? mb : 0) + 12;
                var projected = accumulatedListHeight + item.height + buffer;

                if (projected > remainingSpace) {
                  if (liIdx > 0) {
                    splitIndex = liIdx;
                  } else {
                    splitIndex = currentUsedH > 0 ? -1 : 1;
                  }
                  break;
                }
                accumulatedListHeight += item.height;
              }

              // Chống mồ côi (Orphan Parent Header): Nếu điểm ngắt rơi ngay trước mục con đầu tiên của mục cha,
              // kéo mục cha sang trang mới cùng các mục con nếu trang trước đã có các mục khác
              if (splitIndex > 0 && flatItems[splitIndex - 1] && flatItems[splitIndex - 1].isParentHeader && (splitIndex - 1 > 0)) {
                splitIndex = splitIndex - 1;
                accumulatedListHeight -= flatItems[splitIndex].height;
              }

              if (splitIndex > 0) {
                // Tách ngay bên trong danh sách: chèn li.eru-page-break-gap-li trước mục vượt lề
                var rem = Math.max(0, Math.round(USABLE_PAGE_H - (currentUsedH + (currentUsedH > 0 ? blockMargin : 0) + accumulatedListHeight)));
                var targetItem = flatItems[splitIndex];
                var gapLi = createStandaloneGap(currentPage, rem, { isListBreak: true, nestingDepth: targetItem.depth });
                targetItem.domEl.parentNode.insertBefore(gapLi, targetItem.domEl);
                createdGaps.push({ el: gapLi, page: currentPage });
                currentPage++;

                // Tiếp tục duyệt và tách các mục còn lại nếu danh sách trải dài qua nhiều trang (multi-page list)
                var curPageLiUsed = 0;
                var lastSplitIdx = splitIndex;

                for (var j = splitIndex; j < flatItems.length; j++) {
                  var nextItem = flatItems[j];
                  var isLastItem = (j === flatItems.length - 1);
                  var nextBuffer = (isLastItem ? mb : 0) + 12;

                  if (curPageLiUsed > 0 && (curPageLiUsed + nextItem.height + nextBuffer > USABLE_PAGE_H)) {
                    var actualJ = j;
                    if (flatItems[j - 1] && flatItems[j - 1].isParentHeader && (j - 1 > lastSplitIdx)) {
                      actualJ = j - 1;
                    }
                    var nextRem = Math.max(0, Math.round(USABLE_PAGE_H - curPageLiUsed));
                    var nextGapLi = createStandaloneGap(currentPage, nextRem, { isListBreak: true, nestingDepth: flatItems[actualJ].depth });
                    flatItems[actualJ].domEl.parentNode.insertBefore(nextGapLi, flatItems[actualJ].domEl);
                    createdGaps.push({ el: nextGapLi, page: currentPage });
                    currentPage++;
                    curPageLiUsed = 0;
                    lastSplitIdx = actualJ;
                    j = actualJ - 1;
                  } else {
                    curPageLiUsed += nextItem.height;
                  }
                }

                currentUsedH = curPageLiUsed;
                continue;
              } else if (currentUsedH > 0) {
                // Ngay cả mục đầu tiên cũng không vừa trên trang hiện tại -> Đẩy toàn bộ danh sách sang trang mới
                var remBeforeList = Math.max(0, Math.round(USABLE_PAGE_H - currentUsedH));
                var gapNodeBefore = createStandaloneGap(currentPage, remBeforeList);
                document.body.insertBefore(gapNodeBefore, el);
                createdGaps.push({ el: gapNodeBefore, page: currentPage });
                currentPage++;
                currentUsedH = 0;

                // Kiểm tra xem danh sách có vượt quá trang mới hay không
                if (totalListH > USABLE_PAGE_H) {
                  var cUsed = 0;
                  var lSplit = 0;
                  for (var m = 0; m < flatItems.length; m++) {
                    var nIt = flatItems[m];
                    var isLastM = (m === flatItems.length - 1);
                    var bM = isLastM ? mb : 0;
                    if (cUsed > 0 && (cUsed + nIt.height + bM > USABLE_PAGE_H)) {
                      var aM = m;
                      if (flatItems[m - 1] && flatItems[m - 1].isParentHeader && (m - 1 > lSplit)) {
                        aM = m - 1;
                      }
                      var nR = Math.max(0, Math.round(USABLE_PAGE_H - cUsed));
                      var nGLi = createStandaloneGap(currentPage, nR, { isListBreak: true, nestingDepth: flatItems[aM].depth });
                      flatItems[aM].domEl.parentNode.insertBefore(nGLi, flatItems[aM].domEl);
                      createdGaps.push({ el: nGLi, page: currentPage });
                      currentPage++;
                      cUsed = 0;
                      lSplit = aM;
                      m = aM - 1;
                    } else {
                      cUsed += nIt.height;
                    }
                  }
                  currentUsedH = cUsed;
                  continue;
                } else {
                  currentUsedH = totalListH;
                  continue;
                }
              }
            }
          }
        }

        var isAtomic = el.tagName === 'PRE' || el.classList.contains('eru-callout') || el.classList.contains('embedded-template') || el.querySelector('iframe') !== null || el.querySelector('video') !== null;
        var isHeading = /^H[1-6]$/.test(el.tagName);
        var safetyOffset = isHeading ? 36 : (isAtomic ? 16 : 0);

        // Keep-with-next look-ahead cho tiêu đề trong standalone HTML
        var keepWithNextBuffer = 0;
        if (isHeading) {
          keepWithNextBuffer = 56;
          var nextEl = children[i + 1];
          if (nextEl) {
            if (/^H[1-6]$/.test(nextEl.tagName)) {
              keepWithNextBuffer = 110;
            } else if (nextEl.tagName === 'TABLE') {
              keepWithNextBuffer = 140;
            } else if (
              nextEl.tagName === 'PRE' ||
              nextEl.classList.contains('eru-callout') ||
              nextEl.tagName === 'BLOCKQUOTE' ||
              nextEl.classList.contains('embedded-template') ||
              nextEl.classList.contains('spreadsheet-container') ||
              nextEl.classList.contains('tiptap-mathematics-render') ||
              (nextEl.querySelector && nextEl.querySelector('img, video, iframe'))
            ) {
              keepWithNextBuffer = 130;
            }
          }
        }

        var remainingOnPage = USABLE_PAGE_H - currentUsedH;
        var willOverflow = currentUsedH > 0 && (effectiveH + safetyOffset + keepWithNextBuffer > remainingOnPage);

        if (willOverflow) {
          // Phân trang cấp khối (Block-level): Đẩy nguyên khối sang trang tiếp theo, đồng bộ 100% với Editor
          var remBlock = Math.max(0, Math.round(USABLE_PAGE_H - currentUsedH));
          var gapNode = createStandaloneGap(currentPage, remBlock);
          document.body.insertBefore(gapNode, el);
          createdGaps.push({ el: gapNode, page: currentPage });
          currentPage++;

          if (blockH > USABLE_PAGE_H) {
            var extraPagesBlock = Math.floor((blockH - 1) / USABLE_PAGE_H);
            currentPage += extraPagesBlock;
            currentUsedH = blockH - extraPagesBlock * USABLE_PAGE_H;
          } else {
            currentUsedH = blockH;
          }
        } else {
          currentUsedH += effectiveH;
        }
      }

      var currentFormat = 'full', currentAlign = 'right';
      try { currentFormat = localStorage.getItem('erusentia_paper_page_num_format') || currentFormat; currentAlign = localStorage.getItem('erusentia_paper_page_num_align') || currentAlign; } catch (e) { /* Vẫn đọc được tài liệu khi storage bị chặn. */ }
      document.documentElement.setAttribute('data-page-align', currentAlign);

      function formatPageNumberJs(page, total, fmt) {
        if (fmt === 'compact') return page + ' / ' + total;
        if (fmt === 'current_only') return '' + page;
        if (fmt === 'page_prefix') return 'Trang ' + page;
        if (fmt === 'dash') return '— ' + page + ' —';
        return 'Trang ' + page + ' / ' + total;
      }

      var totalPages = Math.max(1, currentPage);
      if (mode === 'separated') {
        var finalRemaining = Math.max(0, USABLE_PAGE_H - currentUsedH);
        var finalPageContainer = document.createElement('div');
        finalPageContainer.className = 'eru-final-page-container no-print';
        finalPageContainer.innerHTML =
          '<div class="eru-page-break-gap__fill" style="height: ' + Math.round(finalRemaining) + 'px;"></div>' +
          '<div class="eru-page-break-gap__footer"><span class="eru-page-num-text">' + formatPageNumberJs(totalPages, totalPages, currentFormat) + '</span></div>';
        document.body.appendChild(finalPageContainer);
      }

      createdGaps.forEach(function(g) {
        var txt = g.el.querySelector('.eru-page-num-text');
        if (txt) txt.textContent = formatPageNumberJs(g.page, totalPages, currentFormat);
      });
    }

    // ── 4. Paper Mode Setup ──
    var isShowGuide = true;

    function applyPaperMode(mode) {
      document.documentElement.setAttribute('data-paper-mode', mode);
      if (mode === 'continuous') {
        if (paperLabel) paperLabel.textContent = 'Trang liền';
        if (fabGuideBtn) fabGuideBtn.style.display = 'inline-flex';
        applyGuide(isShowGuide);
      } else if (mode === 'separated') {
        if (paperLabel) paperLabel.textContent = 'Trang tách';
        if (fabGuideBtn) fabGuideBtn.style.display = 'none';
        document.documentElement.classList.remove('has-page-guide');
      } else {
        if (paperLabel) paperLabel.textContent = 'Trang giấy';
        if (fabGuideBtn) fabGuideBtn.style.display = 'none';
        document.documentElement.classList.remove('has-page-guide');
      }

      if (paperDropdown) {
        var items = paperDropdown.querySelectorAll('.eru-paper-menu-item');
        items.forEach(function(btn) {
          if (btn.getAttribute('data-mode') === mode) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
      }

      runStandalonePagination(mode);
    }

    window.addEventListener('resize', function() {
      var currentMode = document.documentElement.getAttribute('data-paper-mode');
      if (currentMode === 'separated' || currentMode === 'continuous') {
        runStandalonePagination(currentMode);
      }
    });

    function applyGuide(enable) {
      isShowGuide = enable;
      if (enable) {
        document.documentElement.classList.add('has-page-guide');
        if (fabGuideBtn) {
          fabGuideBtn.classList.add('is-active');
          fabGuideBtn.style.color = 'var(--accent, #F2274C)';
          fabGuideBtn.style.background = 'var(--accent-subtle, rgba(242, 39, 76, 0.12))';
        }
      } else {
        document.documentElement.classList.remove('has-page-guide');
        if (fabGuideBtn) {
          fabGuideBtn.classList.remove('is-active');
          fabGuideBtn.style.color = '';
          fabGuideBtn.style.background = '';
        }
      }
    }

    if (fabPaperBtn && paperDropdown) {
      fabPaperBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        paperDropdown.classList.toggle('open');
      });
      var menuItems = paperDropdown.querySelectorAll('.eru-paper-menu-item');
      menuItems.forEach(function(item) {
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          var mode = item.getAttribute('data-mode') || 'default';
          applyPaperMode(mode);
          paperDropdown.classList.remove('open');
        });
      });
    }

    if (fabGuideBtn) {
      fabGuideBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        applyGuide(!isShowGuide);
      });
    }

    if (btnCloseToc) {
      btnCloseToc.addEventListener('click', function(e) {
        e.stopPropagation();
        closeDrawer();
      });
    }

    if (backdropEl) {
      backdropEl.addEventListener('click', function() {
        closeDrawer();
      });
    }

    document.addEventListener('click', function(e) {
      if (paperDropdown && paperDropdown.classList.contains('open') && !paperDropdown.contains(e.target) && e.target !== fabPaperBtn && !fabPaperBtn.contains(e.target)) {
        paperDropdown.classList.remove('open');
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (tocDrawer && tocDrawer.classList.contains('open')) closeDrawer();
        if (paperDropdown && paperDropdown.classList.contains('open')) paperDropdown.classList.remove('open');
      }
    });

    // ── 5. Theme & Scroll-Top Controls ──
    document.addEventListener('eru:paper-mode', function(event) { applyPaperMode(event.detail); });

    if (fabThemeBtn) {
      fabThemeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark' || document.body.getAttribute('data-theme') === 'dark';
        var nextTheme = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nextTheme);
        document.body.setAttribute('data-theme', nextTheme);
      });
    }

    if (fabTopBtn) {
      fabTopBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    // ── 4. Reading Progress & Scroll Spy (rAF Throttled) ──
    var isScrollTicking = false;
    var lastActiveHeadingId = '';

    function updateScrollState() {
      var sTop = window.pageYOffset || document.documentElement.scrollTop || 0;
      var docH = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var pct = docH > 0 ? Math.min(100, Math.round((sTop / docH) * 100)) : 0;

      if (readPct) readPct.textContent = pct + '%';
      if (readBar) readBar.style.width = pct + '%';

      if (fabTopBtn) {
        fabTopBtn.style.display = sTop > 300 ? 'inline-flex' : 'none';
      }

      if (tocDrawer && tocDrawer.classList.contains('open')) {
        var headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
        var activeId = '';
        for (var i = 0; i < headings.length; i++) {
          var h = headings[i];
          if (h.getBoundingClientRect().top <= 140) {
            activeId = h.id;
          } else {
            break;
          }
        }
        if (activeId && activeId !== lastActiveHeadingId && tocContent) {
          lastActiveHeadingId = activeId;
          var links = tocContent.querySelectorAll('.toc-item');
          for (var j = 0; j < links.length; j++) {
            var link = links[j];
            if (link.getAttribute('href') === '#' + activeId) {
              link.classList.add('active');
            } else {
              link.classList.remove('active');
            }
          }
        }
      }
    }

    function onDocScroll() {
      if (!isScrollTicking) {
        window.requestAnimationFrame(function() {
          updateScrollState();
          isScrollTicking = false;
        });
        isScrollTicking = true;
      }
    }

    window.addEventListener('scroll', onDocScroll, { passive: true });
    updateScrollState();

    // ── 5. Render & Search Table of Contents ──
    function renderTOC(filterText) {
      if (!tocContent) return;
      var headings = Array.from(document.querySelectorAll('h1, h2, h3, h4, h5, h6'));
      tocContent.innerHTML = '';

      if (headings.length === 0) {
        tocContent.innerHTML = '<div style="padding: 24px 12px; color: var(--text-muted); text-align: center; font-size: 0.85rem;">Không có tiêu đề nào trong bài viết.</div>';
        return;
      }

      var matchCount = 0;
      headings.forEach(function(h, idx) {
        if (!h.id) h.id = 'heading-sec-' + idx;
        var text = (h.textContent || '').trim();
        if (filterText && !text.toLowerCase().includes(filterText.toLowerCase())) {
          return;
        }
        matchCount++;

        var a = document.createElement('a');
        a.className = 'toc-item level-' + h.tagName.substring(1);
        a.textContent = text;
        a.href = '#' + h.id;
        a.addEventListener('click', function(evt) {
          evt.preventDefault();
          h.scrollIntoView({ behavior: 'smooth', block: 'start' });
          closeDrawer();
        });
        tocContent.appendChild(a);
      });

      if (matchCount === 0 && filterText) {
        tocContent.innerHTML = '<div style="padding: 24px 12px; color: var(--text-muted); text-align: center; font-size: 0.85rem;">Không tìm thấy tiêu đề phù hợp.</div>';
      }
    }

    if (tocSearch) {
      tocSearch.addEventListener('input', function() {
        renderTOC(tocSearch.value);
      });
    }

    var initialMode = document.documentElement.getAttribute('data-paper-mode') || 'off';
    applyPaperMode(initialMode);
    if (document.fonts) {
      var fontPaginationFrame = 0;
      function refreshFontPagination() {
        cancelAnimationFrame(fontPaginationFrame);
        fontPaginationFrame = requestAnimationFrame(function() {
          var mode = document.documentElement.getAttribute('data-paper-mode');
          if ((mode === 'separated' || mode === 'continuous') && !document.documentElement.hasAttribute('data-eru-presenting')) runStandalonePagination(mode);
        });
      }
      document.fonts.ready.then(refreshFontPagination);
      document.fonts.addEventListener('loadingdone', refreshFontPagination);
    }
  }

  function initStandaloneCodeBlocks() {
    var preBlocks = document.querySelectorAll('pre');
    preBlocks.forEach(function(pre) {
      if (pre.querySelector('.eru-code-header')) return;
      var code = pre.querySelector('code');
      var lang = '';
      if (code) {
        var cls = code.className || '';
        var m = cls.match(/language-([a-zA-Z0-9_-]+)/);
        if (m) lang = m[1];
      }
      if (!lang) {
        var preCls = pre.className || '';
        var pm = preCls.match(/language-([a-zA-Z0-9_-]+)/);
        if (pm) lang = pm[1];
      }

      var codeText = (code ? code.innerText : pre.innerText) || '';
      var lowerText = codeText.toLowerCase();
      var isHtmlLike =
        lowerText.indexOf('<!doctype html') !== -1 ||
        lowerText.indexOf('<html') !== -1 ||
        lowerText.indexOf('<body') !== -1 ||
        lowerText.indexOf('<div') !== -1 ||
        lowerText.indexOf('<p>') !== -1 ||
        lowerText.indexOf('<p ') !== -1 ||
        lowerText.indexOf('<h1') !== -1 ||
        lowerText.indexOf('<h2') !== -1 ||
        lowerText.indexOf('<h3') !== -1 ||
        lowerText.indexOf('</h1>') !== -1 ||
        lowerText.indexOf('</h2>') !== -1 ||
        lowerText.indexOf('</div>') !== -1 ||
        lowerText.indexOf('</body>') !== -1;

      if ((!lang || lang === 'xml' || lang === 'auto') && isHtmlLike) {
        lang = 'html';
      }

      var header = document.createElement('div');
      header.className = 'eru-code-header no-print';
      if (lang) {
        var badge = document.createElement('span');
        badge.className = 'eru-code-lang';
        badge.textContent = lang.toUpperCase();
        header.appendChild(badge);
      }
      var copyBtn = document.createElement('button');
      copyBtn.className = 'eru-code-copy-btn';
      copyBtn.type = 'button';
      copyBtn.title = 'Sao chép mã nguồn';
      var copyIconSvg = "<svg viewBox=\"64 64 896 896\" width=\"13\" height=\"13\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M832 64H296c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8h496v496c0 4.4 3.6 8 8 8h56c4.4 0 8-3.6 8-8V104c0-22.1-17.9-40-40-40zM704 192H192c-17.7 0-32 14.3-32 32v672c0 17.7 14.3 32 32 32h512c17.7 0 32-14.3 32-32V224c0-17.7-14.3-32-32-32zm-40 664H232V264h432v592z\"></path></svg>";
      var checkIconSvg = "<svg viewBox=\"64 64 896 896\" width=\"13\" height=\"13\" fill=\"#10b981\" aria-hidden=\"true\"><path d=\"M912 190h-69.9c-9.8 0-19.1 4.5-25.1 12.2L404.7 724.5 207 474a32 32 0 0 0-25.1-12.2H112c-6.7 0-10.4 7.7-6.3 12.9l273.9 347c12.8 16.2 37.4 16.2 50.3 0l488.4-618.8c4.1-5.1.4-12.9-6.3-12.9z\"></path></svg>";
      copyBtn.innerHTML = copyIconSvg;
      copyBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        var textToCopy = (code ? code.innerText : pre.innerText) || '';
        navigator.clipboard.writeText(textToCopy).then(function() {
          copyBtn.innerHTML = checkIconSvg;
          copyBtn.classList.add('is-copied');
          copyBtn.title = 'Đã sao chép!';
          setTimeout(function() {
            copyBtn.innerHTML = copyIconSvg;
            copyBtn.classList.remove('is-copied');
            copyBtn.title = 'Sao chép mã nguồn';
          }, 1800);
