</style><div data-api-ui="" data-eru-transient="true"></div><script>{
function createEruHostedResourceBridge(connection) {
  const endpoint = new URL(connection.gatewayUrl)
  if (
    endpoint.username ||
    endpoint.password ||
    endpoint.pathname !== '/' ||
    endpoint.search ||
    endpoint.hash ||
    !['https:', 'http:'].includes(endpoint.protocol)
  )
    throw Error('Địa chỉ dịch vụ tài nguyên không hợp lệ.')
  if (
    endpoint.protocol === 'http:' &&
    !['127.0.0.1', 'localhost', '[::1]'].includes(endpoint.hostname)
  )
    throw Error('Dịch vụ online cần HTTPS.')
  const origin = endpoint.origin,
    mount = connection.hostedMount
  if (!mount) throw Error('Không tìm thấy khung đăng nhập dịch vụ tài nguyên.')
  const session = Array.from(
    crypto.getRandomValues(new Uint8Array(16)),
    (value) => value.toString(16).padStart(2, '0'),
  ).join('')
  const frame = document.createElement('iframe')
  frame.title = 'Đăng nhập dịch vụ tài nguyên EruSentia'
  frame.referrerPolicy = 'no-referrer'
  frame.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin')
  frame.style.cssText =
    'display:block;width:100%;height:300px;border:1px solid var(--border-normal,#ddd);border-radius:8px;background:#fafafa'
  frame.src = origin + '/resource-gateway/connect#' + session
  frame.style.display = 'none'
  const ready = () => {
    clearTimeout(availability)
    frame.style.display = 'block'
  }
  const availability = setTimeout(
    () =>
      connection.onUnavailable?.(
        'Chưa kết nối được dịch vụ. Kiểm tra URL và phiên bản đã triển khai, hoặc chọn gateway cục bộ.',
      ),
    20000,
  )
  let identity = null
  const pending = new Map()
  const post = (value) =>
    frame.contentWindow?.postMessage(
      { type: 'eru-resource-v1', session, ...value },
      origin,
    )
  const hello = () => {
    const color = getComputedStyle(mount.closest('[data-eru-tool]') || document.body).backgroundColor.match(/[\d.]+/g)
    const dark = color && color.length >= 3 ? color.slice(0, 3).map(Number).reduce((sum, value) => sum + value, 0) < 390 : document.documentElement.dataset.theme === 'dark'
    post({ kind: 'hello', theme: dark ? 'dark' : 'light' })
  }
  const themeObserver = new MutationObserver(hello)
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class', 'data-theme'] })
  themeObserver.observe(document.head, { subtree: true, childList: true, characterData: true })
  themeObserver.observe(document.body, { attributes: true, attributeFilter: ['style', 'class', 'data-theme'] })
  const receive = (event) => {
    const data = event.data
    if (
      event.source !== frame.contentWindow ||
      event.origin !== origin ||
      data?.type !== 'eru-resource-v1' ||
      data.session !== session
    )
      return
    if (data.kind === 'ready') {
      ready()
      return
    }
    if (data.kind === 'authenticated') {
      ready()
      identity = data.value?.enabled ? data.value : null
      connection.onIdentity?.(identity)
      return
    }
    if (data.kind === 'disconnected') {
      identity = null
      connection.onIdentity?.(null)
      return
    }
    if (data.kind !== 'result' || !pending.has(data.id)) return
    const entry = pending.get(data.id)
    pending.delete(data.id)
    entry.cleanup()
    if (data.error) {
      const messages = {
        RESOURCE_DOCUMENT_ACCESS_DENIED:
          'Tài khoản này chưa được cấp quyền mở tài liệu.',
        RESOURCE_DOCUMENT_NOT_FOUND: 'Tài liệu không tồn tại hoặc đã bị xóa.',
        RESOURCE_DAILY_QUOTA_EXCEEDED:
          'Đã hết hạn mức hôm nay. Thử lại ngày mai hoặc liên hệ quản trị viên.',
        RESOURCE_PLAN_REQUIRED_OR_BLOCKED:
          'Tài khoản chưa được cấp quyền dùng dịch vụ hoặc đang bị khóa.',
        RESOURCE_TARGET_NOT_ALLOWED:
          'Máy chủ API chưa được dịch vụ cho phép. Liên hệ quản trị viên để thêm origin.',
        RESOURCE_TARGET_PATH_NOT_ALLOWED:
          'Đường dẫn này không được gọi qua proxy. Dùng giao diện quản trị hoặc API trực tiếp.',
        RESOURCE_GATEWAY_DISABLED: 'Dịch vụ tài nguyên đang tạm tắt.',
        RESOURCE_SERVICE_BUSY: 'Dịch vụ đang bận. Hãy thử lại sau.',
        RESOURCE_PRIVATE_ADDRESS_BLOCKED:
          'Dịch vụ online không truy cập mạng riêng. Hãy dùng gateway cục bộ.',
        RESOURCE_UPSTREAM_UNAVAILABLE:
          'Dịch vụ không kết nối được máy chủ API đích. Kiểm tra URL và thử lại.',
        RESOURCE_UPSTREAM_TIMEOUT:
          'Máy chủ API đích chưa phản hồi kịp. Hãy thử lại.',
      }
      const error = Error(
        messages[data.error.message] ||
          data.error.message ||
          'Dịch vụ tài nguyên từ chối yêu cầu.',
      )
      error.status = data.error.status
      entry.reject(error)
    } else entry.resolve(data.value)
  }
  addEventListener('message', receive)
  frame.addEventListener('load', hello)
  mount.replaceChildren(frame)
  const expand = () => {
    const details = mount.closest('[data-network]')
    if (details) details.open = true
  }
  return {
    origin,
    async call(action, payload, signal) {
      expand()
      if (!identity)
        throw Error(
          'Đăng nhập dịch vụ EruSentia trong khung kết nối trước khi sử dụng proxy online.',
        )
      if (signal?.aborted) throw new DOMException('Aborted', 'AbortError')
      return new Promise((resolve, reject) => {
        const id = crypto.randomUUID()
        let timer
        const abort = () => {
          post({ kind: 'cancel', id })
          pending.delete(id)
          cleanup()
          reject(new DOMException('Aborted', 'AbortError'))
        }
        const cleanup = () => {
          clearTimeout(timer)
          signal?.removeEventListener('abort', abort)
        }
        timer = setTimeout(() => {
          post({ kind: 'cancel', id })
          pending.delete(id)
          cleanup()
          reject(Error('Dịch vụ tài nguyên chưa phản hồi sau 15 giây.'))
        }, 15000)
        pending.set(id, { resolve, reject, cleanup })
        signal?.addEventListener('abort', abort, { once: true })
        post({ kind: 'request', id, action, payload })
      })
    },
    identity: () => identity,
    destroy() {
      for (const entry of pending.values()) {
        entry.cleanup()
        entry.reject(Error('Kết nối dịch vụ đã đóng.'))
      }
      pending.clear()
      clearTimeout(availability)
      themeObserver.disconnect()
      removeEventListener('message', receive)
      frame.remove()
      identity = null
    },
  }

function createEruResourceTransport() {
  const gatewayAddress = (value) => {
    const url = new URL(value)
    if (
      url.username ||
      url.password ||
      url.search ||
      url.hash ||
      url.pathname !== '/' ||
      !['http:', 'https:'].includes(url.protocol)
    )
      throw Error('Địa chỉ gateway không hợp lệ.')
    if (
      url.protocol === 'http:' &&
      !['127.0.0.1', 'localhost', '[::1]'].includes(url.hostname)
    )
      throw Error('Gateway HTTP phải chạy trên máy cục bộ.')
    return url.origin
  }
  let hosted
  const bridge = (connection) => {
    const origin = new URL(connection.gatewayUrl).origin
    if (!hosted || hosted.origin !== origin) {
      hosted?.destroy()
      hosted = createEruHostedResourceBridge(connection)
    }
    return hosted
  }
  const decode = (result, method) => {
    if (
      result.version !== 1 ||
      typeof result.bodyBase64 !== 'string' ||
      !Number.isInteger(result.status)
    )
      throw Error('Dịch vụ trả về định dạng không được hỗ trợ.')
    const bytes = Uint8Array.from(atob(result.bodyBase64), (c) =>
      c.charCodeAt(0),
    )
    return new Response(
      [204, 205, 304].includes(result.status) || method === 'HEAD'
        ? null
        : bytes,
      {
        status: result.status,
        statusText: result.statusText,
        headers: result.headers,
      },
    )
  }
  return {
    disconnectHosted() {
      hosted?.destroy()
      hosted = null
    },
    connectHosted(connection) {
      return bridge(connection)
    },
    async openDocument(id, connection, signal) {
      return bridge(connection).call('document', { id }, signal)
    },
    async checkGateway(connection, signal) {
      if (connection.transport === 'hosted') {
        const info = await bridge(connection).call('status', {}, signal)
        return { ...info, targets: info.targetOrigins }
      }
      if (!connection.gatewayKey)
        throw Error(
          'Dán khóa phiên được in trong terminal chạy Resource Gateway.',
        )
      const response = await fetch(
        gatewayAddress(connection.gatewayUrl) + '/v1/status',
        {
          headers: { 'X-Eru-Gateway-Key': connection.gatewayKey },
          credentials: 'omit',
          redirect: 'error',
          signal,
        },
      )
      if (!response.ok)
        throw Error('Gateway từ chối khóa phiên hoặc không sẵn sàng.')
      return response.json()
    },
    async request(url, options, connection) {
      if (connection.transport === 'hosted')
        return decode(
          await bridge(connection).call(
            'request',
            {
              url,
              method: options.method || 'GET',
              headers: Object.fromEntries(new Headers(options.headers)),
              ...(options.body !== undefined ? { body: options.body } : {}),
              ...(connection.documentId
                ? { documentId: connection.documentId }
                : {}),
            },
            options.signal,
          ),
          options.method,
        )
      if (connection.transport !== 'gateway')
        return fetch(url, {
          ...options,
          credentials: 'omit',
          redirect: 'error',
        })
      if (!connection.gatewayKey)
        throw Error(
          'Cần khóa phiên để dùng gateway. Chạy Resource Gateway rồi dán khóa vào mục Kết nối.',
        )
      const response = await fetch(
        gatewayAddress(connection.gatewayUrl) + '/v1/request',
        {
          method: 'POST',
          credentials: 'omit',
          redirect: 'error',
          signal: options.signal,
          headers: {
            'Content-Type': 'application/json',
            'X-Eru-Gateway-Key': connection.gatewayKey,
          },
          body: JSON.stringify({
            url,
            method: options.method || 'GET',
            headers: Object.fromEntries(new Headers(options.headers)),
            ...(options.body !== undefined ? { body: options.body } : {}),
          }),
        },
      )
      const result = await response.json()
      if (!response.ok) {
        const messages = {
          TARGET_NOT_ALLOWED:
            'Máy chủ này chưa được gateway cho phép. Khởi động gateway với --target đúng origin.',
          GATEWAY_PAIRING_REQUIRED:
            'Khóa gateway không đúng hoặc phiên đã đổi.',
          UPSTREAM_REDIRECT_BLOCKED:
            'Máy chủ chuyển hướng. Dùng URL đích trực tiếp để tránh chuyển thông tin xác thực sang máy chủ khác.',
          UPSTREAM_TIMEOUT: 'Máy chủ đích không phản hồi trong thời gian chờ.',
          UPSTREAM_UNREACHABLE:
            'Gateway không kết nối được API đích. Kiểm tra địa chỉ và dịch vụ.',
          UPSTREAM_TLS_ERROR:
            'Chứng chỉ TLS của API chưa được tin cậy. Cài CA hợp lệ cho gateway; không tắt xác minh TLS.',
          RESPONSE_TOO_LARGE: 'Phản hồi vượt giới hạn 2 MiB của gateway.',
        }
        throw Error(
          messages[result.error] ||
            `Gateway không hoàn tất yêu cầu: ${result.error || response.status}`,
        )
      }
      return decode(result, options.method)
    },
  }
}

code>pnpm resource:gateway --target ${escape(targetOrigin)}</code>. Chỉ máy chủ được khai báo mới được chuyển tiếp; khóa phiên không lưu vào tài liệu.</p></details>

function createEruToolConnection({
  root,
  ui,
  config,
  feedback,
  status,
  busy = () => {},
  changed = () => {},
  authChanged = () => {},
}) {
  const $ = (selector) => ui.querySelector(selector)
  const transport = createEruResourceTransport()
  let token = '',
    tokenBase = '',
    pending = null,
    epoch = 0
  const base = () => {
    const url = new URL($('[data-base]').value.trim())
    if (
      url.username ||
      url.password ||
      url.search ||
      url.hash ||
      !['http:', 'https:'].includes(url.protocol)
    )
      throw Error(
        'Nhập URL HTTP/HTTPS không kèm tài khoản, query hoặc fragment.',
      )
    return url.href.replace(/\/$/, '')
  }
  const settings = () => ({
    baseUrl: base(),
    transport: $('[data-transport]').value,
    gatewayUrl: $('[data-gateway-url]').value.trim(),
    ...($('[data-document-id]').value.trim()
      ? { documentId: $('[data-document-id]').value.trim() }
      : {}),
  })
  const secretSettings = () => ({
    ...settings(),
    gatewayKey: $('[data-gateway-key]').value.trim(),
    onUnavailable: (message) => feedback(message, true),
    hostedMount: $('[data-hosted-mount]'),
    onIdentity: () => {
      let active = false
      try {
        active = authenticated()
      } catch {
        /* Editable URL. */
      }
      if (!token)
        $('[data-auth-label]').textContent = active
          ? '· Dùng phiên dịch vụ'
          : '· Chưa đăng nhập'
      authChanged(active)
    },
  })
  const hosted = () => transport.connectHosted(secretSettings())
  const authenticated = () =>
    !!token ||
    (settings().transport === 'hosted' &&
      !!hosted().identity() &&
      new URL(base()).origin === hosted().origin)
  const clear = () => {
    token = ''
    tokenBase = ''
    $('[data-token]').value = ''
    $('[data-password]').value = ''
    $('[data-auth-label]').textContent = '· Chưa đăng nhập'
    $('[data-action="logout"]').hidden = true
    authChanged(false)
  }
  const authorize = (value, label) => {
    if (!value?.trim() || /\s/.test(value.trim()))
      throw Error('Token trống hoặc có khoảng trắng không hợp lệ.')
    token = value.trim()
    tokenBase = base()
    $('[data-token]').value = ''
    $('[data-password]').value = ''
    $('[data-auth-label]').textContent = `· ${label}`
    $('[data-action="logout"]').hidden = false
    authChanged(true)
    feedback('Đã cấp token cho máy chủ này. Token không được lưu vào tài liệu.')
  }
  const request = async (path, options = {}, anonymous = false) => {
    if (pending)
      throw Error('Đang có yêu cầu chạy. Hãy đợi hoặc hủy yêu cầu hiện tại.')
    const server = base(),
      currentEpoch = epoch
    if (token && tokenBase !== server) clear()
    const url = new URL(path.startsWith('http') ? path : server + path)
    if (url.origin !== new URL(server).origin)
      throw Error('Yêu cầu phải thuộc máy chủ API đang chọn.')
    const controller = new AbortController()
    pending = controller
    let timedOut = false
    const timer = setTimeout(() => {
      timedOut = true
      controller.abort()
    }, 15000)
    busy(true)
    status('Đang kết nối…')
    try {
      const res = await transport.request(
        url.href,
        {
          ...options,
          signal: controller.signal,
          headers: {
            ...options.headers,
            ...(!anonymous && token
              ? { Authorization: `Bearer ${token}` }
              : {}),
          },
        },
        secretSettings(),
      )
      const text = options.method === 'HEAD' ? '' : await res.text()
      if (text.length > 2000000)
        throw Error('Phản hồi lớn hơn 2 MB. Hãy thu hẹp truy vấn.')
      if (currentEpoch !== epoch || server !== base())
        throw Error('Kết nối đã thay đổi. Hãy gửi lại yêu cầu.')
      status(
        `HTTP ${res.status} · ${settings().transport === 'hosted' ? 'Render' : settings().transport === 'gateway' ? 'Gateway' : 'Trực tiếp'}`,
        res.ok ? 'ok' : 'error',
      )
      let data
      try {
        data = text ? JSON.parse(text) : null
      } catch {
        data = text
      }
      return { res, data, text }
    } catch (error) {
      status('Chưa nhận phản hồi', 'error')
      if (controller.signal.aborted)
        throw Error(
          timedOut ? 'Máy chủ không phản hồi sau 15 giây.' : 'Đã hủy yêu cầu.',
        )
      if (error instanceof TypeError)
        throw Error(
          settings().transport === 'gateway'
            ? 'Không kết nối được gateway. Kiểm tra địa chỉ, dịch vụ cục bộ và quyền truy cập mạng của trình duyệt.'
            : `Không kết nối được. Kiểm tra địa chỉ, CORS và máy chủ. Với file HTML hoặc API chặn CORS, mở Đường kết nối và chọn Resource Gateway. Origin hiện tại: ${location.origin}.`,
        )
      throw error
    } finally {
      clearTimeout(timer)
      pending = null
      busy(false)
    }
  }
  $('[data-login]').addEventListener('submit', async (event) => {
    event.preventDefault()
    feedback()
    try {
      const email = $('[data-email]').value.trim(),
        password = $('[data-password]').value
      const { res, data } = await request(
        '/auth/login',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        },
        true,
      )
      if (!res.ok || typeof data?.accessToken !== 'string')
        throw Error(
          `Đăng nhập thất bại (HTTP ${res.status}). Kiểm tra tài khoản và mật khẩu.`,
        )
      authorize(data.accessToken, data.user?.email || email)
    } catch (error) {
      feedback(error.message, true)
    } finally {
      $('[data-password]').value = ''
    }
  })
  ui.addEventListener('click', async (event) => {
    const action = event.target.closest('button')?.dataset.action
    try {
      if (action === 'authorize')
        authorize($('[data-token]').value, 'Đã cấp Bearer token')
      if (action === 'logout') {
        epoch++
        pending?.abort()
        clear()
        feedback('Đã xóa xác thực trong khối này.')
      }
      if (action === 'cancel') pending?.abort()
      if (action === 'retry-hosted') {
        transport.disconnectHosted()
        hosted()
        feedback('Đang mở kết nối dịch vụ…')
      }
      if (action === 'open-document') {
        const id = $('[data-document-id]').value.trim()
        if (!/^[0-9a-f-]{36}$/i.test(id))
          throw Error('Nhập ID tài liệu hợp lệ do chủ tài liệu cấp.')
        const result = await transport.openDocument(
          id,
          secretSettings(),
          AbortSignal.timeout(15000),
        )
        const frame = document.createElement('iframe')
        frame.title = result.title || 'Tài liệu được cấp quyền'
        frame.setAttribute('sandbox', 'allow-scripts')
        frame.referrerPolicy = 'no-referrer'
        frame.style.cssText =
          'width:100%;height:600px;border:1px solid #ddd;border-radius:8px;margin-top:12px'
        frame.srcdoc = result.html
        $('[data-document-preview]').replaceChildren(frame)
        $('[data-document-preview]').hidden = false
        feedback(
          'Đã xác minh quyền và mở tài liệu. Lượt truy cập được ghi nhận trên dịch vụ.',
        )
      }
      if (action === 'check-gateway') {
        const result = await transport.checkGateway(
          secretSettings(),
          AbortSignal.timeout(5000),
        )
        const allowed = result.targets?.includes(new URL(base()).origin)
        feedback(
          allowed
            ? `Dịch vụ sẵn sàng${result.plan ? ' · ' + result.user.email + ' · gói ' + result.plan + ' · còn ' + result.remaining + '/' + result.dailyLimit + ' yêu cầu' : ''}.`
            : 'Dịch vụ chưa cho phép máy chủ này. Quản trị viên cần thêm đúng origin vào danh sách cho phép.',
          !allowed,
        )
      }
    } catch (error) {
      feedback(error.message, true)
    }
  })
  const update = (event) => {
    if (
      event.target.matches(
        '[data-base],[data-transport],[data-gateway-url],[data-document-id]',
      )
    ) {
      epoch++
      pending?.abort()
      const connectionChanged = !event.target.matches('[data-document-id]')
      if (connectionChanged) clear()
      status('Chưa kết nối')
      const mode = $('[data-transport]').value
      if (event.target.matches('[data-transport]')) {
        const address = $('[data-gateway-url]')
        if (mode === 'hosted' && address.value === 'http://127.0.0.1:3198')
          address.value = 'https://erusentia-api.onrender.com'
        if (
          mode === 'gateway' &&
          address.value === 'https://erusentia-api.onrender.com'
        )
          address.value = 'http://127.0.0.1:3198'
      }
      $('[data-gateway-settings]').hidden = mode === 'direct'
      $('[data-local-key]').hidden = mode !== 'gateway'
      $('[data-local-help]').hidden = mode !== 'gateway'
      $('[data-hosted-settings]').hidden = mode !== 'hosted'
      $('[data-document-preview]').replaceChildren()
      $('[data-document-preview]').hidden = true
      if (event.target.matches('[data-transport],[data-gateway-url]'))
        transport.disconnectHosted()
      $('[data-route-label]').textContent =
        mode === 'hosted'
          ? '· Dịch vụ Render'
          : mode === 'gateway'
            ? '· Gateway cục bộ'
            : '· Trực tiếp'
      if (mode === 'hosted') {
        try {
          hosted()
        } catch (error) {
          feedback(error.message, true)
        }
      }
      try {
        Object.assign(config, settings())
        if (!token && authenticated())
          $('[data-auth-label]').textContent = '· Dùng phiên dịch vụ'
        changed()
        feedback(
          connectionChanged
            ? 'Đã cập nhật đường kết nối.'
            : 'Đã cập nhật tài liệu được bảo vệ.',
        )
      } catch (error) {
        feedback(error.message, true)
      }
    }
  }
  ui.addEventListener('change', update)
  window.addEventListener(
    'pagehide',
    () => {
      pending?.abort()
      transport.disconnectHosted()
      token = ''
      $('[data-gateway-key]').value = ''
    },
    { once: true },
  )
  if (settings().transport === 'hosted') {
    try {
      hosted()
    } catch (error) {
      feedback(error.message, true)
    }
  }
  return {
    request,
    base,
    settings,
    authenticated,
    abort: () => pending?.abort(),
    clear,
  }
}
