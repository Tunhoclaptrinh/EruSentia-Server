<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img"><title>Chọn đường kết nối theo môi trường tài liệu</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b62543"/></marker></defs><rect x="1" y="1" width="998" height="678" rx="14" fill="#f7f6f2" stroke="#ded9cd"/><g font-family="Inter,Arial,sans-serif" fill="#24211e"><text x="28" y="37" font-size="18" fill="#b62543" font-weight="700">RESOURCE GATEWAY / CHỌN ĐÚNG ĐƯỜNG KẾT NỐI</text><rect x="28" y="60" width="944" height="99" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="84" font-size="18" fill="#b62543" font-weight="700">01 / QUYỀN CORS HỢP LỆ</text><text x="46" y="111" font-size="22" fill="#24211e" font-weight="650">Direct · Tài liệu → API</text><text x="46" y="142" font-size="18" fill="#5c5553" font-weight="400">Cùng origin hoặc API cho phép origin hiện tại. Không dùng relay nếu không cần.</text><rect x="28" y="219" width="944" height="99" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="243" font-size="18" fill="#b62543" font-weight="700">02 / TÀI NGUYÊN TRÊN MÁY NGƯỜI DÙNG</text><text x="46" y="270" font-size="22" fill="#24211e" font-weight="650">Local · Tài liệu → gateway trên máy → API máy/LAN</text><text x="46" y="301" font-size="18" fill="#5c5553" font-weight="400">Ghép khóa phiên; chọn target/root. Giữ asset tương đối và giới hạn truy cập thư mục.</text><rect x="28" y="378" width="944" height="99" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="402" font-size="18" fill="#b62543" font-weight="700">03 / DỊCH VỤ TÀI NGUYÊN CÓ XÁC THỰC</text><text x="46" y="429" font-size="22" fill="#24211e" font-weight="650">Hosted · Tài liệu → dịch vụ Render → đích được phép</text><text x="46" y="460" font-size="18" fill="#5c5553" font-weight="400">Backend kiểm identity, plan, quota, ACL và audit. Không phải một proxy mở.</text><text x="28" y="572" font-size="19" fill="#5c5553" font-weight="400">File HTML không nhận ngầm phiên của app. Cấu hình không được tự nâng entitlement.</text><text x="28" y="614" font-size="19" fill="#5c5553" font-weight="400">CSP/iframe/cookie và quyền của website ngoài vẫn là ranh giới cần tôn trọng.</text></g></svg>