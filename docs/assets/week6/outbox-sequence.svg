<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" width="1000" height="830" role="img"><title>Vòng đời một bản cập nhật và điểm có thể xử lý lại</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b62543"/></marker></defs><rect x="1" y="1" width="998" height="828" rx="14" fill="#f7f6f2" stroke="#ded9cd"/><g font-family="Inter,Arial,sans-serif" fill="#24211e"><text x="28" y="37" font-size="18" fill="#b62543" font-weight="700">TRANSACTIONAL OUTBOX / TỪ REQUEST ĐẾN FEED</text><rect x="28" y="60" width="944" height="99" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="84" font-size="18" fill="#b62543" font-weight="700">API → POSTGRESQL</text><text x="46" y="111" font-size="22" fill="#24211e" font-weight="650">01 · COMMIT nghiệp vụ</text><text x="46" y="142" font-size="18" fill="#5c5553" font-weight="400">Template + revision + outbox cùng transaction. Rollback thì không có bản ghi nửa chừng.</text><path d="M500 163L500 204" stroke="#b62543" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="214" width="944" height="99" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="238" font-size="18" fill="#b62543" font-weight="700">OUTBOX → RABBITMQ</text><text x="46" y="265" font-size="22" fill="#24211e" font-weight="650">02 · Dispatcher publish</text><text x="46" y="296" font-size="18" fill="#5c5553" font-weight="400">SKIP LOCKED lấy hàng chờ. Publish hoàn tất rồi mới đánh dấu published_at.</text><path d="M500 317L500 358" stroke="#b62543" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="368" width="944" height="99" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="392" font-size="18" fill="#b62543" font-weight="700">SỰ KIỆN CÓ THỂ ĐƯỢC GIAO LẠI</text><text x="46" y="419" font-size="22" fill="#24211e" font-weight="650">03 · Worker fanout idempotent</text><text x="46" y="450" font-size="18" fill="#5c5553" font-weight="400">Kiểm public/hidden → khóa revision → unique recipient/template/revision.</text><path d="M500 471L500 512" stroke="#b62543" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="522" width="944" height="99" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="546" font-size="18" fill="#b62543" font-weight="700">POSTGRESQL → CACHE → UI</text><text x="46" y="573" font-size="22" fill="#24211e" font-weight="650">04 · Invalidate sau COMMIT</text><text x="46" y="604" font-size="18" fill="#5c5553" font-weight="400">Dữ liệu thông báo ở DB; Redis giữ số đếm. Client lấy feed bằng cursor ghép.</text><text x="28" y="690" font-size="22" fill="#b62543" font-weight="650">Cửa sổ publish xong nhưng chưa commit có thể phát lại.</text><text x="28" y="727" font-size="18" fill="#5c5553" font-weight="400">Bảo đảm cần chứng minh: kết quả nghiệp vụ không trùng, không phải message chỉ đi một lần.</text><text x="28" y="777" font-size="18" fill="#5c5553" font-weight="400">Test repository và test xuyên broker thật là hai lớp bằng chứng khác nhau.</text></g></svg>