<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" role="img"><title>Các nhóm bảng tuần 6 và khóa nghiệp vụ</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b62543"/></marker></defs><rect x="1" y="1" width="998" height="708" rx="14" fill="#f7f6f2" stroke="#ded9cd"/><g font-family="Inter,Arial,sans-serif" fill="#24211e"><text x="28" y="37" font-size="18" fill="#b62543" font-weight="700">MÔ HÌNH DỮ LIỆU / NHÓM BẢNG VÀ BẤT BIẾN</text><rect x="28" y="60" width="448" height="126" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="84" font-size="18" fill="#b62543" font-weight="700">PHÁT HÀNH VÀ THEO DÕI</text><text x="46" y="111" font-size="22" fill="#24211e" font-weight="650">Template &amp; follower</text><text x="46" y="142" font-size="18" fill="#5c5553" font-weight="400">templates → revisions → message_outbox</text><text x="46" y="169" font-size="18" fill="#5c5553" font-weight="400">template_follows: PK(user, template)</text><rect x="524" y="60" width="448" height="126" rx="9" fill="#fff" stroke="#ded9cd"/><text x="542" y="84" font-size="18" fill="#b62543" font-weight="700">CHỐNG TRÙNG VÀ CURSOR</text><text x="542" y="111" font-size="22" fill="#24211e" font-weight="650">Notification feed</text><text x="542" y="142" font-size="18" fill="#5c5553" font-weight="400">Unique(recipient, template, revision)</text><text x="542" y="169" font-size="18" fill="#5c5553" font-weight="400">Index(recipient, created_at, id)</text><path d="M479 125L519 125" stroke="#b62543" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="262" width="448" height="126" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="286" font-size="18" fill="#b62543" font-weight="700">ISOLATION VÀ VAI TRÒ</text><text x="46" y="313" font-size="22" fill="#24211e" font-weight="650">Workspace &amp; membership</text><text x="46" y="344" font-size="18" fill="#5c5553" font-weight="400">workspaces → workspace_members</text><text x="46" y="371" font-size="18" fill="#5c5553" font-weight="400">PK(workspace, user) + role CHECK</text><rect x="524" y="262" width="448" height="126" rx="9" fill="#fff" stroke="#ded9cd"/><text x="542" y="286" font-size="18" fill="#b62543" font-weight="700">TRẠNG THÁI VÀ TRUY VẾT</text><text x="542" y="313" font-size="22" fill="#24211e" font-weight="650">Invite &amp; resource link</text><text x="542" y="344" font-size="18" fill="#5c5553" font-weight="400">email, token, expires_at, accepted_at</text><text x="542" y="371" font-size="18" fill="#5c5553" font-weight="400">workspace_resources + audit logs</text><path d="M479 327L519 327" stroke="#b62543" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="464" width="448" height="126" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="488" font-size="18" fill="#b62543" font-weight="700">NỘI DUNG VÀ QUYỀN ĐỌC</text><text x="46" y="515" font-size="22" fill="#24211e" font-weight="650">Tài liệu được bảo vệ</text><text x="46" y="546" font-size="18" fill="#5c5553" font-weight="400">resource_documents → grants</text><text x="46" y="573" font-size="18" fill="#5c5553" font-weight="400">private / shared / premium</text><rect x="524" y="464" width="448" height="126" rx="9" fill="#fff" stroke="#ded9cd"/><text x="542" y="488" font-size="18" fill="#b62543" font-weight="700">POLICY VÀ HẠN MỨC</text><text x="542" y="515" font-size="22" fill="#24211e" font-weight="650">Plan, usage &amp; access event</text><text x="542" y="546" font-size="18" fill="#5c5553" font-weight="400">Entitlement do server quyết định</text><text x="542" y="573" font-size="18" fill="#5c5553" font-weight="400">Quota theo user/ngày; audit kết quả</text><path d="M479 529L519 529" stroke="#b62543" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="28" y="677" font-size="19" fill="#5c5553" font-weight="400">Khóa/index có mục đích cụ thể; không dùng số thứ tự migration làm số bảng.</text></g></svg>