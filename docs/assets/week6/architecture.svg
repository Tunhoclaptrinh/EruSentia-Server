<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img"><title>Kiến trúc EruSentia và ranh giới dữ liệu</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b62543"/></marker></defs><rect x="1" y="1" width="998" height="638" rx="14" fill="#f7f6f2" stroke="#ded9cd"/><g font-family="Inter,Arial,sans-serif" fill="#24211e"><text x="28" y="37" font-size="15" fill="#b62543" font-weight="700">ERUSENTIA / KIẾN TRÚC TÍCH HỢP TUẦN 6</text><rect x="28" y="62" width="452" height="99" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="86" font-size="12" fill="#b62543" font-weight="700">01 / NGƯỜI DÙNG</text><text x="46" y="113" font-size="22" fill="#24211e" font-weight="650">App Web / Electron</text><text x="46" y="144" font-size="18" fill="#5c5553" font-weight="400">Note, template, phiên và workspace</text><rect x="520" y="62" width="452" height="99" rx="9" fill="#fff" stroke="#ded9cd"/><text x="538" y="86" font-size="12" fill="#b62543" font-weight="700">02 / TÀI LIỆU PORTABLE</text><text x="538" y="113" font-size="22" fill="#24211e" font-weight="650">HTML độc lập</text><text x="538" y="144" font-size="18" fill="#5c5553" font-weight="400">Nội dung, runtime đọc và công cụ</text><path d="M255 162L255 214" stroke="#b62543" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M745 162L745 214" stroke="#b62543" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="224" width="452" height="99" rx="9" fill="#fff" stroke="#ded9cd"/><text x="46" y="248" font-size="12" fill="#b62543" font-weight="700">03 / HỢP ĐỒNG VÀ CHÍNH SÁCH</text><text x="46" y="275" font-size="22" fill="#24211e" font-weight="650">NestJS API</text><text x="46" y="306" font-size="18" fill="#5c5553" font-weight="400">DTO · JWT · quyền · transaction</text><rect x="520" y="224" width="452" height="99" rx="9" fill="#fff" stroke="#ded9cd"/>