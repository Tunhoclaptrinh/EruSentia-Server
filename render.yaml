# Render Free API + external Neon PostgreSQL. See docs/RENDER_NEON.md.
services:
  - type: web
    name: erusentia-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: TEMPLATE_STORE
        value: postgres
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: eru_project_render
      - key: DB_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://tunhoclaptrinh.github.io,https://eru-sentia.vercel.app
      - key: SWAGGER_ENABLED
        value: "true"
      - key: PROJECT_BOOTSTRAP
        value: "true"
      - key: PROJECT_COMMUNITY_DEMO
        value: "true"
      - key: PROJECT_DEMO_ACCOUNTS
        value: "false"
      - key: QUEUE_ENABLED
        value: "false"
      - key: CACHE_ENABLED
        value: "false"
      - key: API_RATE_LIMITS_ENABLED
        value: "true"
      - key: TEMPLATE_QUOTA_COUNT
        value: "100"
      - key: TEMPLATE_QUOTA_CONTENT_BYTES
        value: "20971520"
      - key: TEMPLATE_RETAINED_COUNT
        value: "500"
      - key: TEMPLATE_RETAINED_REVISIONS
        value: "10000"
      - key: TEMPLATE_RETAINED_BYTES
        value: "209715200"
      - key: REPORT_RETAINED_COUNT
        value: "1000"
      - key: TRUST_PROXY_HOPS
        value: "0"

      - key: RESOURCE_GATEWAY_ENABLED
        value: "true"
      - key: RESOURCE_TARGET_ORIGINS
        value: https://erusentia-api.onrender.com
      - key: RESOURCE_FREE_DAILY_LIMIT
        value: "30"
      - key: RESOURCE_PREMIUM_DAILY_LIMIT
        value: "500"
