</main><script>const cards=[['HTML đảm nhiệm vai trò gì?','Mô tả cấu trúc và ý nghĩa của nội dung.'],['CSS đảm nhiệm vai trò gì?','Quy định cách trình bày: màu, font, bố cục và trạng thái hiển thị.'],['JavaScript đảm nhiệm vai trò gì?','Xử lý hành vi và cập nhật nội dung theo tương tác.']];const root=document.querySelector('main');let index=Math.max(0,Math.min(cards.length-1,Number(root.dataset.cardIndex)||0)),back=root.dataset.cardBack==='true';function show(){root.dataset.cardIndex=String(index);root.dataset.cardBack=String(back);document.querySelector('#position').textContent='Thẻ '+(index+1)+' / 3';document.querySelector('#card-text').textContent=cards[index][back?1:0];document.querySelector('#flip').textContent=back?'Xem câu hỏi':'Lật thẻ'}document.querySelector('#flip').onclick=()=>{back=!back;show()};document.querySelector('#next').onclick=()=>{index=(index+1)%cards.length;back=false;show()};show();</script></html>
